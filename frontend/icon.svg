<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Incremental">
  <!-- Deliberately abstract: the game's real palette is generated per seed, so a
       fixed icon should not claim a colour identity the run will contradict. -->
  <rect width="512" height="512" rx="112" fill="#0b0e14"/>
  <g fill="none" stroke-linecap="round" stroke-width="26">
    <path d="M104 372 L104 300" stroke="#3d4a60"/>
    <path d="M180 372 L180 262" stroke="#4d6382"/>
    <path d="M256 372 L256 216" stroke="#5f83ac"/>
    <path d="M332 372 L332 166" stroke="#7cc4ff"/>
    <path d="M408 372 L408 112" stroke="#a9dcff"/>
  </g>
  <circle cx="408" cy="112" r="24" fill="#a9dcff"/>
</svg>
