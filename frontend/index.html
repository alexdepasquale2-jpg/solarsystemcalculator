<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + the safe-area insets in the CSS keep the action bar
     clear of the iOS home indicator. user-scalable=no because pinch-zoom on a
     tap-heavy game is always an accident. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<meta name="description" content="A generative incremental game. Every seed is a different game.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Incremental — generated</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-spinner" aria-hidden="true"></div>
    <p>Generating a world…</p>
  </div>
</div>

<header class="topbar">
  <div class="topbar-main">
    <h1 id="run-title">…</h1>
    <p id="run-flavor" class="flavor"></p>
  </div>
  <button id="btn-menu" class="icon-btn" aria-label="Menu" aria-expanded="false">≡</button>
</header>

<!-- Resource rail. Sticky under the header: current amounts are the one thing
     that must never require scrolling to see. -->
<section id="resources" class="resources" aria-label="Resources"></section>

<main>
  <div id="panels">
    <section id="panel-do" class="panel" data-tab="do">
      <div id="actions" class="actions" aria-label="Actions"></div>
      <div id="mechanics" class="mechanics" aria-label="This run's rules"></div>
    </section>

    <section id="panel-build" class="panel" data-tab="build" hidden>
      <div id="generators" class="cards" aria-label="Generators"></div>
    </section>

    <section id="panel-research" class="panel" data-tab="research" hidden>
      <div id="upgrades" class="cards" aria-label="Upgrades"></div>
    </section>

    <section id="panel-ascend" class="panel" data-tab="ascend" hidden>
      <div id="prestige-head" class="prestige-head"></div>
      <div id="prestige-upgrades" class="cards" aria-label="Permanent upgrades"></div>
    </section>
  </div>
</main>

<nav class="tabbar" aria-label="Sections">
  <button class="tab is-active" data-tab="do"><span>Work</span></button>
  <button class="tab" data-tab="build"><span>Build</span><i class="badge" hidden></i></button>
  <button class="tab" data-tab="research"><span>Research</span><i class="badge" hidden></i></button>
  <button class="tab" data-tab="ascend"><span>Ascend</span><i class="badge" hidden></i></button>
</nav>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

<dialog id="menu" class="menu">
  <h2>Run</h2>
  <p class="menu-seed">Seed <code id="menu-seed">—</code></p>
  <div id="menu-stats" class="menu-stats"></div>
  <div class="menu-actions">
    <button id="btn-copy-seed" class="btn">Copy seed</button>
    <button id="btn-export" class="btn">Export save</button>
    <button id="btn-import" class="btn">Import save</button>
  </div>
  <h2>New world</h2>
  <p class="hint">A new seed is a different game: different resources, different
    rules, different everything. This discards the current run.</p>
  <div class="menu-actions">
    <input id="menu-new-seed" class="input" inputmode="numeric" placeholder="seed (blank = random)">
    <button id="btn-new" class="btn btn-danger">Generate</button>
  </div>
  <button id="btn-close-menu" class="btn btn-wide">Close</button>
</dialog>

<script src="/js/format.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
