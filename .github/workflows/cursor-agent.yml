name: Cursor Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task for the Cursor agent
        required: true
        type: string
      runtime:
        description: SDK runtime
        required: true
        type: choice
        options:
          - local
          - cloud
        default: local
      create_pr:
        description: Cloud only — open a PR when the run finishes
        required: false
        type: boolean
        default: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run Cursor agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          extra=()
          if [ "${{ inputs.runtime }}" = "cloud" ]; then
            extra+=(--runtime cloud --ci)
            if [ "${{ inputs.create_pr }}" = "true" ]; then
              extra+=(--pr)
            fi
          else
            extra+=(--runtime local --cwd "$GITHUB_WORKSPACE")
          fi
          npm run agent -- send --quiet "${extra[@]}" "${{ inputs.prompt }}"
