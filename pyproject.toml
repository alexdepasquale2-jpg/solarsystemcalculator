[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solarsystemcalculator"
version = "1.0.0"
description = "Professional-grade orbital mechanics calculator for solar system bodies with 3D visualization and ML correction models."
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Solar System Calculator Contributors"}
]
maintainers = [
    {name = "Solar System Calculator Contributors"}
]
keywords = [
    "astronomy",
    "orbital-mechanics",
    "solar-system",
    "ephemeris",
    "visualization",
    "machine-learning",
    "kepler",
    "planets",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Multimedia :: Graphics :: 3D",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
]
ephemeris = [
    "skyfield>=1.54",
    "jplephem>=2.24",
]
visualizer = [
    "pygame>=2.4",
    "PyOpenGL>=3.1.5",
    "PyOpenGL_accelerate>=3.1.5",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
all = [
    "solarsystemcalculator[ml,ephemeris,visualizer]",
]

[project.urls]
Homepage = "https://github.com/yourusername/solarsystemcalculator"
Documentation = "https://github.com/yourusername/solarsystemcalculator#readme"
Repository = "https://github.com/yourusername/solarsystemcalculator"
Issues = "https://github.com/yourusername/solarsystemcalculator/issues"

[project.scripts]
solarsystemcalculator = "solarsystemcalculator.__main__:main"
solarsystemcalculator-help = "solarsystemcalculator.help:main"
solarsystemcalculator-gui = "solarsystemcalculator.gui:main"
solarsystemcalculator-viz = "solarsystemcalculator.visualizer:launch_visualizer"
launch-gui = "solarsystemcalculator.gui:main"
launch-viz = "solarsystemcalculator.visualizer:launch_visualizer"

[tool.setuptools]
packages = ["solarsystemcalculator"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
