/* -- tuning (mirrors generator.TUNING) ------------------------------------ */

const TUNING = {
  resourcesMin: 3, resourcesMax: 6,
  clickActions: [1, 2], convertsPerTier: [1, 2],
  clickYield: [0.8, 1.4], convertRatio: [6, 14], convertCooldown: [0.25, 1.5],
  generatorsPerResource: [1, 2],
  genRateTier0: [0.25, 1.1],
  // 0.16 made a tier-4 generator produce one unit per forty minutes: buyable, and
  // doing nothing. 0.22 keeps deep tiers worth building.
  genRateFalloff: 0.22,
  genBaseCostTier0: [10, 30], genCostGrowth: [1.12, 1.21],
  genUpkeepChance: 0.55, genUpkeepFraction: [0.15, 0.6],
  upgradeFamilies: [3, 5], upgradeTiers: 5, upgradesPerTier: [6, 12],
  // Raised from [60,25,10,6,4,3] once effects started targeting content at the
  // player's own depth: they stopped being wasted, worth ~40% more in practice.
  costUnitByTier: [108, 45, 18, 11, 7, 5],
  // Raised from 2.6: at that value the top of the tree was barely dearer than the
  // middle and ~14% of seeds bought the whole thing inside twenty minutes.
  costTierStep: 3.4,
  gateTierStep: 2.2, gateUnitScale: 1.5,
  requiresChance: 0.55,
  mechanics: [2, 4],
  decayChance: 0.45, decayRate: [0.004, 0.02],
  prestigeUpgrades: [6, 9],
  // Score weights each resource by 10^tier, so a deep chain scores an order of
  // magnitude faster than a shallow one. Scaling by depth keeps the same number
  // from meaning two different games.
  prestigeDivisor: 3800, prestigeDepthScale: 0.9,
  // Geometric, because permanent multipliers compound. A linear surcharge loses
  // that race and the loop collapses to a 25-second treadmill.
  prestigeEscalation: [1.7, 2.2],
};

const FAMILY_SPECIALTIES = ['action', 'generator', 'resource', 'capacity', 'efficiency', 'critical'];
const MIN_UPGRADE_GAIN = 1.08;
const MIN_REDUCTION = 0.05;
const MAX_OFFLINE_SECONDS = 8 * 3600;
const TEASE_THRESHOLD = 0.35;

/* -- generation (mirrors generator.py) ------------------------------------ */

/** A multiplier that is always worth buying. Rolling raw crosses 1.0. */
function gain(rng, base) { return Math.round(Math.max(MIN_UPGRADE_GAIN, rng.jitter(base, 0.2)) * 1000) / 1000; }

function generateGame(seed) {
  const rng = new Rng(seed);
  const namer = new Namer(rng);

  const baseHue = rng.random();
  const theme = {
    hue: (baseHue * 360).toFixed(1),
    accent: hslHex(baseHue, 0.72, 0.66),
    secondary: hslHex((baseHue + 0.5) % 1, 0.45, 0.62),
  };

  const resources = genResources(rng, namer);
  const maxTier = Math.max(...resources.map(r => r.tier));
  const actions = genActions(rng, namer, resources);
  let generators = genGenerators(rng, namer, resources);
  let upgrades = genUpgrades(rng, namer, resources, actions, generators, maxTier);
  ({ upgrades, generators } = wireUnlockUpgrade(rng, upgrades, actions, generators));
  const mechanics = genMechanics(rng, namer, resources, actions, upgrades);
  applyScarcity(resources, mechanics);
  const prestige = genPrestige(rng, namer, resources, theme);

  const game = {
    seed,
    title: 'The ' + namer.unique(N.ADJ, N.TITLE),
    flavor: rng.choice(N.OPEN) + ' ' + rng.choice(N.CLOSE),
    theme, resources, actions, generators, upgrades, mechanics,
    maxTier,
    prestigeName: prestige.name,
    prestigeUpgrades: prestige.upgrades,
    prestigeDivisor: roundNice(rng.jitter(TUNING.prestigeDivisor * (1 + TUNING.prestigeDepthScale * maxTier), 0.3)),
    prestigeEscalation: rng.uniform(...TUNING.prestigeEscalation),
  };

  game.byId = {
    resource: Object.fromEntries(resources.map(r => [r.id, r])),
    action: Object.fromEntries(actions.map(a => [a.id, a])),
    generator: Object.fromEntries(generators.map(g => [g.id, g])),
    upgrade: Object.fromEntries(upgrades.map(u => [u.id, u])),
    prestige: Object.fromEntries(prestige.upgrades.map(p => [p.id, p])),
  };

  validate(game);
  return game;
}

function genResources(rng, namer) {
  const count = rng.randint(TUNING.resourcesMin, TUNING.resourcesMax);

  // Always a tier 0. Sometimes two resources share a tier, which gives a
  // branching economy rather than a single ladder.
  const tiers = [0];
  let current = 0;
  for (let i = 1; i < count; i++) {
    if (current > 0 && rng.random() < 0.28) tiers.push(current);
    else tiers.push(++current);
  }

  const colors = palette(rng, count);
  return tiers.map((tier, i) => {
    // Tier 0 gets a plain noun, refined tiers an adjective, so the chain reads as
    // raw material -> product without needing a tooltip.
    const name = tier === 0 ? namer.unique(N.RES) : namer.unique(N.ADJ, N.RES);
    let cap = Infinity;
    if (rng.random() >= 0.35) cap = roundNice(rng.jitter(Math.max(25, 2000 / Math.pow(4, tier)), 0.35));
    return {
      id: slug(name), name, color: colors[i], tier, cap, decay: 0,
      description: rng.choice(N.RES_DESC),
    };
  });
}

function genActions(rng, namer, resources) {
  const actions = [];
  const base = resources.filter(r => r.tier === 0);

  // Free clicks, never gated: a run must be playable in the first frame.
  const clicks = rng.randint(...TUNING.clickActions);
  for (let i = 0; i < clicks; i++) {
    const resource = base[i % base.length];
    const name = namer.unique(N.VERB, [resource.name]);
    actions.push({
      id: slug(name), name, kind: 'click', description: rng.choice(N.ACT_DESC),
      cost: {}, output: { [resource.id]: roundNice(rng.jitter(rng.uniform(...TUNING.clickYield), 0.2)) },
      cooldown: 0, unlock: { kind: 'none' },
    });
  }

  // Converts: the spine of the economy. Without them higher tiers are unreachable.
  const byTier = {};
  resources.forEach(r => (byTier[r.tier] ??= []).push(r));
  for (const tier of Object.keys(byTier).map(Number).filter(t => t > 0).sort((a, b) => a - b)) {
    const inputs = byTier[tier - 1] || byTier[0];
    for (const resource of byTier[tier]) {
      for (let i = 0; i < rng.randint(...TUNING.convertsPerTier); i++) {
        const source = rng.choice(inputs);
        const ratio = roundNice(rng.jitter(rng.uniform(...TUNING.convertRatio), 0.2));
        const name = namer.unique(N.VERB, [resource.name]);
        actions.push({
          id: slug(name), name, kind: 'convert', description: rng.choice(N.ACT_DESC),
          cost: { [source.id]: ratio },
          output: { [resource.id]: roundNice(rng.jitter(1, 0.25)) },
          cooldown: Math.round(rng.uniform(...TUNING.convertCooldown) * 100) / 100,
          unlock: { kind: 'resource_total', target: source.id, amount: roundNice(ratio * rng.uniform(2, 6)) },
        });
      }
    }
  }
  return actions;
}

function genGenerators(rng, namer, resources) {
  const generators = [];
  const byTier = {};
  resources.forEach(r => (byTier[r.tier] ??= []).push(r));

  for (const resource of resources) {
    for (let i = 0; i < rng.randint(...TUNING.generatorsPerResource); i++) {
      const name = namer.unique(N.ADJ, N.GEN);
      const rate = Number(rng.jitter(
        rng.uniform(...TUNING.genRateTier0) * Math.pow(TUNING.genRateFalloff, resource.tier), 0.25
      ).toPrecision(4));

      // Bought with the tier below what they make, so every purchase trades off
      // against converting by hand.
      const lower = byTier[resource.tier - 1];
      const costResource = lower ? rng.choice(lower) : resource;
      const scale = TUNING.costUnitByTier[Math.min(costResource.tier, 5)] / TUNING.costUnitByTier[0];
      const baseCost = roundNice(rng.jitter(rng.uniform(...TUNING.genBaseCostTier0) * Math.max(0.15, scale) * 2.5, 0.3));

      const upkeep = {};
      if (resource.tier > 0 && lower && rng.random() < TUNING.genUpkeepChance) {
        const feed = rng.choice(lower);
        upkeep[feed.id] = Number((rate * rng.uniform(...TUNING.genUpkeepFraction) * 8).toPrecision(4));
      }

      let unlock = { kind: 'none' };
      if (resource.tier > 0 || generators.length) {
        unlock = { kind: 'resource_total', target: costResource.id, amount: roundNice(baseCost * rng.uniform(0.6, 1.4)) };
      }

      generators.push({
        id: slug(name), name, description: rng.choice(N.GEN_DESC),
        resource: resource.id, rate, costResource: costResource.id,
        baseCost, costGrowth: Math.round(rng.uniform(...TUNING.genCostGrowth) * 1000) / 1000,
        upkeep, unlock,
      });
    }
  }

  // The first generator must be reachable immediately, or the opening stalls on
  // clicking with nothing to spend on.
  const tier0 = new Set(resources.filter(r => r.tier === 0).map(r => r.id));
  const first = generators.find(g => tier0.has(g.resource));
  if (first) first.unlock = { kind: 'none' };
  return generators;
}

function genUpgrades(rng, namer, resources, actions, generators, maxTier) {
  const families = rng.sample(N.FAMILY, rng.randint(...TUNING.upgradeFamilies));
  const specialties = Object.fromEntries(families.map(f => [f, rng.choice(FAMILY_SPECIALTIES)]));
  const upgrades = [];
  const byFamily = Object.fromEntries(families.map(f => [f, []]));

  for (let tier = 0; tier < TUNING.upgradeTiers; tier++) {
    for (let i = 0; i < rng.randint(...TUNING.upgradesPerTier); i++) {
      const family = rng.choice(families);
      const name = namer.unique(N.ADJ, N.UPG);
      const upgrade = {
        id: slug(name), name, family, tier,
        description: rng.choice(N.UPG_DESC),
        cost: upgradeCost(rng, tier, maxTier, resources),
        effects: genEffects(rng, specialties[family], tier, resources, actions, generators),
        requires: [],
        unlock: tier === 0 ? { kind: 'none' } : rng.weighted([
          [{ kind: 'upgrades_owned', target: '', amount: 2 + 3 * tier }, 2],
          [{ kind: 'family_owned', target: family, amount: 1 + tier }, 1],
          [resourceGate(rng, tier, maxTier, resources), 1.5],
        ]),
      };
      upgrades.push(upgrade);
      byFamily[family].push(upgrade);
    }
  }

  // Shallow trees: requirements only ever point at a lower tier in the same
  // family, which makes cycles structurally impossible rather than a thing to test.
  for (const members of Object.values(byFamily)) {
    const ordered = members.slice().sort((a, b) => a.tier - b.tier);
    ordered.forEach((upgrade, index) => {
      if (index === 0 || upgrade.tier === 0) return;
      const earlier = ordered.slice(0, index).filter(u => u.tier < upgrade.tier);
      if (earlier.length && rng.random() < TUNING.requiresChance) upgrade.requires = [rng.choice(earlier).id];
    });
  }
  return upgrades;
}

function upgradeCost(rng, tier, maxTier, resources) {
  const wantTier = Math.min(maxTier, Math.max(0, tier - rng.choice([0, 0, 1])));
  const candidates = resources.filter(r => r.tier === wantTier);
  const resource = rng.choice(candidates.length ? candidates : resources);
  const unit = TUNING.costUnitByTier[Math.min(resource.tier, 5)];
  const amount = unit * Math.pow(TUNING.costTierStep, Math.max(0, tier - resource.tier));
  return { [resource.id]: roundNice(rng.jitter(amount, 0.3)) };
}

/**
 * A gate priced in the same per-tier units as costs.
 *
 * Scaling by the upgrade's tier alone demanded 9,720 of a resource that caps at
 * 25 — the upgrade hid forever and the run silently lost part of its tree.
 */
function resourceGate(rng, tier, maxTier, resources) {
  const wantTier = Math.min(maxTier, rng.randint(0, tier));
  const candidates = resources.filter(r => r.tier === wantTier);
  const resource = rng.choice(candidates.length ? candidates : resources);
  const unit = TUNING.costUnitByTier[Math.min(resource.tier, 5)];
  const amount = unit * Math.pow(TUNING.gateTierStep, tier) * TUNING.gateUnitScale;
  return { kind: 'resource_total', target: resource.id, amount: roundNice(rng.jitter(amount, 0.25)) };
}

function genEffects(rng, specialty, tier, resources, actions, generators) {
  // Tier 0 is never probabilistic: the first upgrade has to teach you that
  // upgrades do something, and "+4% chance of x3.6" is unreadable at that point.
  // And the specialty holds only ~70% of the time, or three cards from one family
  // sit next to each other reading identically.
  if (tier === 0) specialty = rng.choice(['action', 'generator', 'resource']);
  else if (rng.random() < 0.3) specialty = rng.choice(FAMILY_SPECIALTIES);

  const strength = 1 + 0.12 * tier;
  const effects = [oneEffect(rng, specialty, tier, strength, resources, actions, generators)];
  if (tier >= 2 && rng.random() < 0.3) {
    effects.push(oneEffect(rng, rng.choice(FAMILY_SPECIALTIES), tier, strength * 0.7, resources, actions, generators));
  }
  if (tier >= 3 && rng.random() < 0.18) effects.push({ kind: 'global_mult', target: '', value: gain(rng, 1.06 + 0.02 * tier) });
  return effects;
}

/**
 * Prefer a target the player can plausibly already have.
 *
 * A tier-0 upgrade boosting storage of a tier-3 resource is not wrong, but it is
 * unreadable and unfelt as the first thing a new run shows you.
 */
function targetForTier(rng, tier, candidates, tierOf) {
  const reachable = candidates.filter(c => tierOf(c) <= tier + 1);
  return rng.choice(reachable.length ? reachable : candidates);
}

function oneEffect(rng, specialty, tier, strength, resources, actions, generators) {
  const wildcard = rng.random() < 0.25;
  const resourceTier = r => r.tier;
  const outputTier = item => {
    const ids = item.output ? Object.keys(item.output) : [item.resource];
    const tiers = resources.filter(r => ids.includes(r.id)).map(r => r.tier);
    return tiers.length ? Math.max(...tiers) : 0;
  };

  if (specialty === 'action' && actions.length) {
    return { kind: 'action_yield', target: wildcard ? '*' : targetForTier(rng, tier, actions, outputTier).id, value: gain(rng, 1.2 * strength) };
  }
  if (specialty === 'generator' && generators.length) {
    return { kind: 'generator_rate', target: wildcard ? '*' : targetForTier(rng, tier, generators, outputTier).id, value: gain(rng, 1.25 * strength) };
  }
  if (specialty === 'resource') {
    return { kind: 'resource_rate', target: wildcard ? '*' : targetForTier(rng, tier, resources, resourceTier).id, value: gain(rng, 1.3 * strength) };
  }
  if (specialty === 'capacity') {
    const capped = resources.filter(r => Number.isFinite(r.cap));
    if (capped.length) return { kind: 'resource_cap', target: targetForTier(rng, tier, capped, resourceTier).id, value: gain(rng, 1.8 + 0.3 * tier) };
    return { kind: 'resource_rate', target: targetForTier(rng, tier, resources, resourceTier).id, value: gain(rng, 1.25 * strength) };
  }
  if (specialty === 'efficiency') {
    if (generators.length && rng.random() < 0.5) {
      return { kind: 'generator_cost', target: wildcard ? '*' : rng.choice(generators).id, value: 1 - Math.min(0.14, 0.05 + 0.015 * tier) };
    }
    const cooldowns = actions.filter(a => a.cooldown > 0);
    if (cooldowns.length) return { kind: 'cooldown', target: rng.choice(cooldowns).id, value: 1 - Math.min(0.3, 0.1 + 0.04 * tier) };
    return { kind: 'generator_rate', target: '*', value: gain(rng, 1.15 * strength) };
  }
  if (specialty === 'critical' && actions.length) {
    return {
      kind: 'crit_chance', target: wildcard ? '*' : rng.choice(actions).id,
      value: Math.min(0.3, rng.jitter(0.04 + 0.015 * tier, 0.25)),
      mult: Math.round(rng.jitter(3 + tier, 0.3) * 100) / 100,
    };
  }
  return { kind: 'global_mult', target: '', value: gain(rng, 1.05 + 0.015 * tier) };
}

/**
 * Make one thing unlockable by research instead of by threshold.
 *
 * Only tier-0 upgrades are used as the key, so the unlock can never end up gated
 * behind the thing it unlocks.
 */
function wireUnlockUpgrade(rng, upgrades, actions, generators) {
  const keys = upgrades.filter(u => u.tier === 0 && u.unlock.kind === 'none');
  const gatedActions = actions.filter(a => a.kind === 'convert');
  const gatedGenerators = generators.filter(g => g.unlock.kind !== 'none');
  if (!keys.length || (!gatedActions.length && !gatedGenerators.length)) return { upgrades, generators };

  const key = rng.choice(keys);
  const gate = { kind: 'upgrade_owned', target: key.id, amount: 1 };
  const target = (gatedActions.length && (!gatedGenerators.length || rng.random() < 0.5))
    ? rng.choice(gatedActions) : rng.choice(gatedGenerators);
  target.unlock = gate;
  key.description = `Working notes that make ${target.name} possible.`;
  return { upgrades, generators };
}

function genMechanics(rng, namer, resources, actions, upgrades) {
  const name = () => namer.unique(N.ADJ, N.UPG);
  const builders = {
    synergy: () => {
      const families = [...new Set(upgrades.map(u => u.family))];
      if (!families.length) return null;
      const family = rng.choice(families);
      const per = Math.round(rng.jitter(0.06, 0.4) * 10000) / 10000;
      const kind = rng.choice(['global_mult', 'action_yield', 'generator_rate']);
      const label = { global_mult: 'all production', action_yield: 'every action', generator_rate: 'every generator' }[kind];
      const n = name();
      return { id: slug(n), kind: 'synergy', name: n, params: { family, per, effectKind: kind },
        description: `Each ${family} upgrade you own raises ${label} by ${(per * 100).toFixed(1)}%.` };
    },
    cascade: () => {
      if (actions.length < 2) return null;
      const [source, other] = rng.sample(actions, 2);
      const chance = Math.round(rng.jitter(0.12, 0.4) * 10000) / 10000;
      const n = name();
      return { id: slug(n), kind: 'cascade', name: n, params: { action: source.id, other: other.id, chance },
        description: `${(chance * 100).toFixed(0)}% of the time, ${source.name} also triggers ${other.name} for free — cost and cooldown ignored.` };
    },
    overflow: () => {
      const capped = resources.filter(r => Number.isFinite(r.cap));
      if (!capped.length || resources.length < 2) return null;
      const source = rng.choice(capped);
      const dest = rng.choice(resources.filter(r => r.id !== source.id));
      const ratio = Math.round(rng.jitter(0.08, 0.5) * 10000) / 10000;
      const n = name();
      return { id: slug(n), kind: 'overflow', name: n, params: { source: source.id, dest: dest.id, ratio },
        description: `${source.name} past its cap is not lost: it spills into ${dest.name} at ${ratio.toFixed(3)} per unit.` };
    },
    momentum: () => {
      const window = Math.round(rng.uniform(1.2, 3) * 100) / 100;
      const perClick = Math.round(rng.jitter(0.04, 0.4) * 10000) / 10000;
      const maxStacks = rng.randint(10, 40);
      const n = name();
      return { id: slug(n), kind: 'momentum', name: n, params: { window, perClick, maxStacks },
        description: `Consecutive actions within ${window.toFixed(1)}s stack +${(perClick * 100).toFixed(1)}% output, up to ${maxStacks} stacks. Pausing resets it.` };
    },
    resonance: () => {
      const everyN = rng.randint(5, 13);
      const mult = Math.round(rng.jitter(4, 0.35) * 100) / 100;
      const n = name();
      return { id: slug(n), kind: 'resonance', name: n, params: { everyN, mult },
        description: `Every ${everyN}th action pays out ×${mult.toFixed(1)}.` };
    },
    symbiosis: () => {
      if (resources.length < 2) return null;
      const [target, driver] = rng.sample(resources, 2);
      const coeff = Math.round(rng.jitter(0.18, 0.4) * 10000) / 10000;
      const n = name();
      return { id: slug(n), kind: 'symbiosis', name: n, params: { resource: target.id, driver: driver.id, coeff },
        description: `${target.name} production scales with how much ${driver.name} you are holding: +${(coeff * 100).toFixed(0)}% per order of magnitude.` };
    },
    scarcity: () => {
      // Only refined resources decay; a decaying tier 0 makes the opening minute
      // feel broken rather than tense.
      const candidates = resources.filter(r => r.tier > 0);
      if (!candidates.length || rng.random() > TUNING.decayChance) return null;
      const resource = rng.choice(candidates);
      const rate = Math.round(rng.uniform(...TUNING.decayRate) * 100000) / 100000;
      const n = name();
      return { id: slug(n), kind: 'scarcity', name: n, params: { resource: resource.id, decay: rate },
        description: `${resource.name} will not sit still: it loses ${(rate * 100).toFixed(2)}% of itself every second. Spend it or lose it.` };
    },
  };

  const wanted = rng.randint(...TUNING.mechanics);
  const out = [];
  for (const kind of rng.sample(Object.keys(builders), Object.keys(builders).length)) {
    if (out.length >= wanted) break;
    const built = builders[kind]();
    if (built) out.push(built);
  }
  return out;
}

function applyScarcity(resources, mechanics) {
  for (const mechanic of mechanics) {
    if (mechanic.kind !== 'scarcity') continue;
    const resource = resources.find(r => r.id === mechanic.params.resource);
    if (resource) resource.decay = mechanic.params.decay;
  }
}

function genPrestige(rng, namer, resources, theme) {
  const name = namer.unique(N.ADJ, N.PRESTIGE);
  const upgrades = [];

  // Every run gets one repeatable global multiplier — the backbone of
  // meta-progression: always worth something, never the only thing worth buying.
  const spine = namer.unique(N.ADJ, N.UPG);
  upgrades.push({
    id: slug(spine), name: spine,
    description: 'Permanently raises all production. Buy it again as often as you can.',
    baseCost: 1, maxLevel: 50, costGrowth: rng.uniform(1.45, 1.75),
    effects: [{ kind: 'global_mult', target: '', value: gain(rng, 1.12) }],
  });

  // And one head start, so a fresh run after prestige does not begin with the
  // same bare-hands minute every single time.
  const base = resources.filter(r => r.tier === 0);
  if (base.length) {
    const headStart = rng.choice(base);
    const label = namer.unique(N.ADJ, N.UPG);
    upgrades.push({
      id: slug(label), name: label,
      description: `Begin each run holding ${headStart.name}.`,
      baseCost: 2, maxLevel: 25, costGrowth: rng.uniform(1.5, 1.9),
      effects: [{ kind: 'start_resource', target: headStart.id, value: roundNice(rng.jitter(60, 0.3)) }],
    });
  }

  const count = rng.randint(...TUNING.prestigeUpgrades);
  while (upgrades.length < count) {
    const label = namer.unique(N.ADJ, N.UPG);
    const specialty = rng.choice(FAMILY_SPECIALTIES);
    const repeatable = rng.random() < 0.5;
    let effect;
    if (specialty === 'action') effect = { kind: 'action_yield', target: '*', value: gain(rng, 1.25) };
    else if (specialty === 'generator') effect = { kind: 'generator_rate', target: '*', value: gain(rng, 1.3) };
    else if (specialty === 'resource') effect = { kind: 'resource_rate', target: rng.choice(resources).id, value: gain(rng, 1.5) };
    else if (specialty === 'efficiency') effect = { kind: 'generator_cost', target: '*', value: 1 - rng.jitter(0.07, 0.3) };
    else if (specialty === 'critical') effect = { kind: 'crit_chance', target: '*', value: rng.jitter(0.05, 0.3), mult: Math.round(rng.jitter(4, 0.3) * 100) / 100 };
    else {
      const capped = resources.filter(r => Number.isFinite(r.cap));
      effect = capped.length
        ? { kind: 'resource_cap', target: rng.choice(capped).id, value: gain(rng, 2.5) }
        : { kind: 'global_mult', target: '', value: gain(rng, 1.1) };
    }
    upgrades.push({
      id: slug(label), name: label, description: rng.choice(N.UPG_DESC),
      baseCost: roundNice(rng.jitter(rng.uniform(2, 12), 0.3)),
      maxLevel: repeatable ? rng.randint(5, 20) : 1,
      costGrowth: repeatable ? rng.uniform(1.35, 1.8) : 1,
      effects: [effect],
    });
  }
  return { name, upgrades };
}

/**
 * Structural invariants that make a run playable.
 *
 * Generated content fails in ways hand-authored content cannot: a resource
 * nothing produces, a first frame with no available action. Each is a soft-lock,
 * and a soft-lock is indistinguishable from a crash.
 */
function validate(game) {
  const fail = why => { throw new Error('generated an invalid game: ' + why); };
  if (!game.resources.some(r => r.tier === 0)) fail('no tier-0 resource');
  if (!game.actions.some(a => a.unlock.kind === 'none' && !Object.keys(a.cost).length)) fail('no free opening action');

  const produced = new Set(game.generators.map(g => g.resource));
  game.actions.forEach(a => Object.keys(a.output).forEach(id => produced.add(id)));
  const orphan = game.resources.find(r => !produced.has(r.id));
  if (orphan) fail(`${orphan.name} has no producer`);

  for (const generator of game.generators) {
    if (generator.costGrowth <= 1) fail(`${generator.name} has no cost growth`);
    if (!(generator.rate > 0)) fail(`${generator.name} produces nothing`);
  }
  for (const upgrade of game.upgrades) {
    if (!upgrade.effects.length) fail(`${upgrade.name} does nothing`);
    for (const req of upgrade.requires) {
      if (game.byId.upgrade[req].tier >= upgrade.tier) fail(`${upgrade.name} requirement is not strictly earlier`);
    }
  }
  if (!(game.prestigeDivisor > 0) || !game.prestigeUpgrades.length) fail('prestige is not configured');
}

/* -- engine (mirrors engine.py) ------------------------------------------- */

const LIVE_STEP = 0.5, IDLE_STEP = 5;

class Engine {
  constructor(game, state) {
    this.game = game;
    this.state = state || this.freshState();
    this._mods = null;
    if (!this.state.updatedAt) this.state.updatedAt = Date.now() / 1000;
  }

  freshState() {
    const state = {
      amounts: {}, earned: {}, lifetime: {}, generators: {}, upgrades: [],
      prestigeCurrency: 0, prestigeLevels: {}, ascensions: 0,
      actionReady: {}, actionCount: 0, streak: 0, lastActionAt: 0,
      playtime: 0, bestPoints: 0, updatedAt: Date.now() / 1000,
    };
    this.game.resources.forEach(r => (state.amounts[r.id] = 0));
    return state;
  }

  /* -- modifiers --------------------------------------------------------- */

  get mods() { return (this._mods ??= this.computeMods()); }
  invalidate() { this._mods = null; }

  computeMods() {
    const mods = {
      globalMult: 1, resourceRate: {}, resourceCap: {}, actionYield: {},
      generatorRate: {}, generatorCost: {}, cooldown: {}, decay: {},
      critChance: {}, critMult: {}, startResource: {},
    };
    const mul = (table, key, value) => { table[key] = (table[key] ?? 1) * value; };

    const apply = (effect, level) => {
      const target = effect.target || '*';
      const v = Math.pow(effect.value, level);
      switch (effect.kind) {
        case 'global_mult': mods.globalMult *= v; break;
        case 'resource_rate': mul(mods.resourceRate, target, v); break;
        case 'resource_cap': mul(mods.resourceCap, target, v); break;
        case 'action_yield': mul(mods.actionYield, target, v); break;
        case 'generator_rate': mul(mods.generatorRate, target, v); break;
        case 'generator_cost': mul(mods.generatorCost, target, v); break;
        case 'cooldown': mul(mods.cooldown, target, v); break;
        case 'decay': mul(mods.decay, target, v); break;
        case 'crit_chance':
          mods.critChance[target] = (mods.critChance[target] ?? 0) + effect.value * level;
          mods.critMult[target] = Math.max(mods.critMult[target] ?? 1, effect.mult ?? 2);
          break;
        case 'start_resource':
          mods.startResource[target] = (mods.startResource[target] ?? 0) + effect.value * level;
          break;
      }
    };

    for (const id of this.state.upgrades) this.game.byId.upgrade[id]?.effects.forEach(e => apply(e, 1));
    for (const [id, level] of Object.entries(this.state.prestigeLevels)) {
      if (level > 0) this.game.byId.prestige[id]?.effects.forEach(e => apply(e, level));
    }

    // Synergies read counts, so they run after the flat stack. This is what makes
    // "ten cheap upgrades from one family" viable against "three expensive ones".
    for (const mechanic of this.game.mechanics) {
      if (mechanic.kind !== 'synergy') continue;
      const owned = this.state.upgrades.filter(id => this.game.byId.upgrade[id]?.family === mechanic.params.family).length;
      if (!owned) continue;
      const factor = 1 + mechanic.params.per * owned;
      if (mechanic.params.effectKind === 'global_mult') mods.globalMult *= factor;
      else if (mechanic.params.effectKind === 'action_yield') mul(mods.actionYield, '*', factor);
      else mul(mods.generatorRate, '*', factor);
    }
    return mods;
  }

  mult(table, key) { return (table[key] ?? 1) * (table['*'] ?? 1); }
  reduction(table, key) { return Math.max(MIN_REDUCTION, this.mult(table, key)); }

  /* -- derived ----------------------------------------------------------- */

  capOf(id) {
    const base = this.game.byId.resource[id].cap;
    return Number.isFinite(base) ? base * this.mult(this.mods.resourceCap, id) : Infinity;
  }

  decayOf(id) {
    const base = this.game.byId.resource[id].decay;
    return base > 0 ? base * this.reduction(this.mods.decay, id) : 0;
  }

  generatorCost(id, count = 1) {
    const generator = this.game.byId.generator[id];
    const owned = this.state.generators[id] ?? 0;
    const g = generator.costGrowth;
    const first = generator.baseCost * Math.pow(g, owned) * this.reduction(this.mods.generatorCost, id);
    return count <= 1 ? first : first * (Math.pow(g, count) - 1) / (g - 1);
  }

  maxAffordable(id, limit = 1000) {
    const generator = this.game.byId.generator[id];
    const available = this.state.amounts[generator.costResource] ?? 0;
    const first = this.generatorCost(id, 1);
    if (available < first) return 0;
    const g = generator.costGrowth;
    return Math.max(0, Math.min(limit, Math.floor(Math.log(available * (g - 1) / first + 1) / Math.log(g))));
  }

  actionYield(action) {
    const m = this.mult(this.mods.actionYield, action.id) * this.mods.globalMult;
    return Object.fromEntries(Object.entries(action.output).map(([id, v]) => [id, v * m]));
  }

  actionCooldown(action) {
    return action.cooldown > 0 ? action.cooldown * this.reduction(this.mods.cooldown, action.id) : 0;
  }

  symbiosisFactor(id) {
    let factor = 1;
    for (const mechanic of this.game.mechanics) {
      if (mechanic.kind !== 'symbiosis' || mechanic.params.resource !== id) continue;
      const driver = this.state.amounts[mechanic.params.driver] ?? 0;
      factor *= 1 + mechanic.params.coeff * Math.log10(1 + Math.max(0, driver));
    }
    return factor;
  }

  /**
   * Production, drain, and per-generator efficiency.
   *
   * A generator whose upkeep is running dry throttles rather than stopping. That
   * single choice is most of the mid-run tension: overbuilding a tier-2 farm
   * quietly starves the tier-1 stock feeding it, and the fix is a decision.
   */
  rates() {
    const gross = {}, drain = {}, efficiency = {}, demand = {};

    for (const generator of this.game.generators) {
      const owned = this.state.generators[generator.id] ?? 0;
      if (!owned) continue;
      for (const [id, per] of Object.entries(generator.upkeep)) demand[id] = (demand[id] ?? 0) + per * owned;
    }

    const supply = {};
    for (const [id, wanted] of Object.entries(demand)) {
      if (wanted <= 0) continue;
      let incoming = 0;
      for (const generator of this.game.generators) {
        if (generator.resource === id) incoming += generator.rate * (this.state.generators[generator.id] ?? 0);
      }
      const capacity = (this.state.amounts[id] ?? 0) + incoming;
      supply[id] = capacity >= wanted ? 1 : Math.max(0, capacity / wanted);
    }

    for (const generator of this.game.generators) {
      const owned = this.state.generators[generator.id] ?? 0;
      if (!owned) continue;
      let eff = 1;
      for (const id of Object.keys(generator.upkeep)) eff = Math.min(eff, supply[id] ?? 1);
      efficiency[generator.id] = eff;
      if (eff <= 0) continue;
      gross[generator.resource] = (gross[generator.resource] ?? 0)
        + generator.rate * owned * eff * this.mult(this.mods.generatorRate, generator.id);
      for (const [id, per] of Object.entries(generator.upkeep)) drain[id] = (drain[id] ?? 0) + per * owned * eff;
    }

    for (const resource of this.game.resources) {
      let total = gross[resource.id] ?? 0;
      if (total <= 0) { gross[resource.id] = 0; continue; }
      total *= this.mult(this.mods.resourceRate, resource.id) * this.mods.globalMult * this.symbiosisFactor(resource.id);
      gross[resource.id] = total;
    }
    return { gross, drain, efficiency };
  }

  netRates() {
    const { gross, drain } = this.rates();
    const net = {};
    for (const resource of this.game.resources) {
      let value = (gross[resource.id] ?? 0) - (drain[resource.id] ?? 0);
      const decay = this.decayOf(resource.id);
      if (decay > 0) value -= (this.state.amounts[resource.id] ?? 0) * decay;
      net[resource.id] = value;
    }
    return net;
  }

  /* -- simulation -------------------------------------------------------- */

  advance(now = Date.now() / 1000) {
    let elapsed = now - this.state.updatedAt;
    if (elapsed <= 0) { this.state.updatedAt = now; return 0; }

    // Chunked rather than applied in one step: decay, caps, and overflow are all
    // path-dependent, so a single four-hour step would credit production a cap
    // should have thrown away.
    const simulated = Math.min(elapsed, MAX_OFFLINE_SECONDS);
    let remaining = simulated;
    while (remaining > 1e-9) {
      const step = Math.min(remaining, remaining > 60 ? IDLE_STEP : LIVE_STEP);
      this.step(step);
      remaining -= step;
    }
    this.state.playtime += simulated;
    this.state.updatedAt = now;
    return simulated;
  }

  step(dt) {
    const { gross, drain } = this.rates();
    for (const [id, amount] of Object.entries(drain)) {
      if (amount > 0) this.state.amounts[id] = Math.max(0, (this.state.amounts[id] ?? 0) - amount * dt);
    }
    for (const [id, amount] of Object.entries(gross)) if (amount > 0) this.credit(id, amount * dt);
    for (const resource of this.game.resources) {
      const decay = this.decayOf(resource.id);
      if (decay > 0) this.state.amounts[resource.id] *= Math.exp(-decay * dt);
    }
  }

  /** The only place amounts grows, which is what makes earnings impossible to double-count. */
  credit(id, amount) {
    if (amount <= 0) return;
    const cap = this.capOf(id);
    const current = this.state.amounts[id] ?? 0;

    if (!Number.isFinite(cap) || current + amount <= cap) {
      this.state.amounts[id] = current + amount;
      this.state.earned[id] = (this.state.earned[id] ?? 0) + amount;
      this.state.lifetime[id] = (this.state.lifetime[id] ?? 0) + amount;
      return;
    }

    const room = Math.max(0, cap - current);
    this.state.amounts[id] = cap;
    if (room > 0) {
      this.state.earned[id] = (this.state.earned[id] ?? 0) + room;
      this.state.lifetime[id] = (this.state.lifetime[id] ?? 0) + room;
    }
    this.spill(id, amount - room);
  }

  /** Route over-cap production through any overflow mechanic. Never recurses. */
  spill(id, excess) {
    if (excess <= 0) return;
    for (const mechanic of this.game.mechanics) {
      if (mechanic.kind !== 'overflow' || mechanic.params.source !== id) continue;
      const dest = mechanic.params.dest;
      const gained = excess * mechanic.params.ratio;
      if (gained <= 0) continue;
      const cap = this.capOf(dest), current = this.state.amounts[dest] ?? 0;
      const retained = Number.isFinite(cap) ? Math.max(0, Math.min(gained, cap - current)) : gained;
      if (retained > 0) {
        this.state.amounts[dest] = current + retained;
        this.state.earned[dest] = (this.state.earned[dest] ?? 0) + retained;
        this.state.lifetime[dest] = (this.state.lifetime[dest] ?? 0) + retained;
      }
    }
  }

  /**
   * Deterministic roll from the run seed and the saved action counter, so a save
   * replays identically — reproducibility survives the random parts.
   */
  roll(salt = 0) {
    let x = Math.imul(this.game.seed ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(this.state.actionCount + 1, 0xc2b2ae35);
    x = Math.imul(x ^ (x >>> 13), 0x27d4eb2f) ^ Math.imul(salt + 1, 0x165667b1);
    x ^= x >>> 16;
    return (x >>> 0) / 4294967296;
  }

  /* -- player actions ---------------------------------------------------- */

  canAfford(cost) { return Object.entries(cost).every(([id, amount]) => (this.state.amounts[id] ?? 0) >= amount); }
  spend(cost) { for (const [id, amount] of Object.entries(cost)) this.state.amounts[id] = Math.max(0, (this.state.amounts[id] ?? 0) - amount); }

  doAction(id) {
    const now = Date.now() / 1000;
    this.advance(now);
    const action = this.game.byId.action[id];
    if (!action) return { ok: false, reason: 'no such action' };
    if (!this.isUnlocked(action.unlock)) return { ok: false, reason: 'locked' };
    if (now < (this.state.actionReady[id] ?? 0)) return { ok: false, reason: 'cooling down' };
    if (!this.canAfford(action.cost)) return { ok: false, reason: 'cannot afford' };

    this.spend(action.cost);
    this.state.actionCount += 1;

    let multiplier = this.momentumMultiplier(now);
    this.state.lastActionAt = now;
    multiplier *= this.resonanceMultiplier();
    const crit = this.critMultiplier(action);
    multiplier *= crit;

    const gained = {};
    for (const [rid, amount] of Object.entries(this.actionYield(action))) {
      gained[rid] = amount * multiplier;
      this.credit(rid, gained[rid]);
    }

    const cooldown = this.actionCooldown(action);
    if (cooldown > 0) this.state.actionReady[id] = now + cooldown;

    return { ok: true, gained, multiplier, crit: crit > 1, cascade: this.maybeCascade(action) };
  }

  momentumMultiplier(now) {
    const mechanic = this.game.mechanics.find(m => m.kind === 'momentum');
    if (!mechanic) { this.state.streak = 1; return 1; }
    if (this.state.lastActionAt && now - this.state.lastActionAt <= mechanic.params.window) this.state.streak += 1;
    else this.state.streak = 1;
    return 1 + mechanic.params.perClick * Math.min(this.state.streak - 1, mechanic.params.maxStacks);
  }

  resonanceMultiplier() {
    const mechanic = this.game.mechanics.find(m => m.kind === 'resonance');
    if (!mechanic) return 1;
    return this.state.actionCount % mechanic.params.everyN === 0 ? mechanic.params.mult : 1;
  }

  critMultiplier(action) {
    const chance = (this.mods.critChance[action.id] ?? 0) + (this.mods.critChance['*'] ?? 0);
    if (chance <= 0) return 1;
    if (this.roll(1) >= Math.min(0.95, chance)) return 1;
    return Math.max(this.mods.critMult[action.id] ?? 1, this.mods.critMult['*'] ?? 1);
  }

  /** One level deep on purpose: two actions pointing at each other would loop forever. */
  maybeCascade(action) {
    for (const mechanic of this.game.mechanics) {
      if (mechanic.kind !== 'cascade' || mechanic.params.action !== action.id) continue;
      if (this.roll(2) >= mechanic.params.chance) continue;
      const other = this.game.byId.action[mechanic.params.other];
      if (!other || !this.isUnlocked(other.unlock)) continue;
      const gained = this.actionYield(other);
      for (const [id, amount] of Object.entries(gained)) this.credit(id, amount);
      return { name: other.name, gained };
    }
    return null;
  }

  buyGenerator(id, count = 1) {
    this.advance();
    const generator = this.game.byId.generator[id];
    if (!generator || !this.isUnlocked(generator.unlock)) return { ok: false, reason: 'locked' };

    let wanted = count === 'max' ? this.maxAffordable(id) : Math.max(1, count);
    if (wanted <= 0) return { ok: false, reason: 'cannot afford' };
    let price = this.generatorCost(id, wanted);
    if ((this.state.amounts[generator.costResource] ?? 0) < price) {
      wanted = this.maxAffordable(id);
      if (wanted <= 0) return { ok: false, reason: 'cannot afford' };
      price = this.generatorCost(id, wanted);
    }

    this.spend({ [generator.costResource]: price });
    this.state.generators[id] = (this.state.generators[id] ?? 0) + wanted;
    return { ok: true, bought: wanted };
  }

  buyUpgrade(id) {
    this.advance();
    const upgrade = this.game.byId.upgrade[id];
    if (!upgrade) return { ok: false, reason: 'no such upgrade' };
    if (this.state.upgrades.includes(id)) return { ok: false, reason: 'already owned' };
    if (!this.upgradeAvailable(upgrade)) return { ok: false, reason: 'locked' };
    if (!this.canAfford(upgrade.cost)) return { ok: false, reason: 'cannot afford' };
    this.spend(upgrade.cost);
    this.state.upgrades.push(id);
    this.invalidate();
    return { ok: true, name: upgrade.name };
  }

  buyPrestigeUpgrade(id) {
    this.advance();
    const upgrade = this.game.byId.prestige[id];
    if (!upgrade) return { ok: false, reason: 'no such upgrade' };
    const level = this.state.prestigeLevels[id] ?? 0;
    if (level >= upgrade.maxLevel) return { ok: false, reason: 'maxed' };
    const price = upgrade.baseCost * Math.pow(upgrade.costGrowth, level);
    if (this.state.prestigeCurrency < price) return { ok: false, reason: 'cannot afford' };
    this.state.prestigeCurrency -= price;
    this.state.prestigeLevels[id] = level + 1;
    this.invalidate();
    return { ok: true, level: level + 1 };
  }

  /* -- prestige ---------------------------------------------------------- */

  /** Weighted by depth, or prestige would reward grinding tier 0 forever. */
  runScore() {
    let total = 0;
    for (const resource of this.game.resources) {
      const earned = this.state.earned[resource.id] ?? 0;
      if (earned > 0) total += earned * Math.pow(10, resource.tier);
    }
    return total;
  }

  /**
   * Score per prestige point, escalating geometrically with each ascension.
   *
   * The square root below is not enough on its own: permanent multipliers
   * compound, so score grows geometrically while sqrt only halves the exponent.
   * A linear surcharge loses the same race and the loop collapses to seconds.
   */
  prestigeRequirement() {
    return this.game.prestigeDivisor * Math.pow(this.game.prestigeEscalation, this.state.ascensions);
  }

  prestigePoints() {
    const score = this.runScore();
    return score <= 0 ? 0 : Math.floor(Math.sqrt(score / this.prestigeRequirement()));
  }

  prestige() {
    this.advance();
    const points = this.prestigePoints();
    if (points < 1) return { ok: false, reason: 'not enough progress' };
    this.state.prestigeCurrency += points;
    this.state.bestPoints = Math.max(this.state.bestPoints, points);
    this.state.ascensions += 1;
    this.resetRun();
    return { ok: true, points };
  }

  /** Called on prestige only; a fresh game takes the same path via freshState. */
  resetRun() {
    const state = this.state;
    this.game.resources.forEach(r => (state.amounts[r.id] = 0));
    state.earned = {};
    state.generators = {};
    state.upgrades = [];
    state.actionReady = {};
    state.actionCount = 0;
    state.streak = 0;
    state.lastActionAt = 0;
    state.updatedAt = Date.now() / 1000;
    this.invalidate();
    for (const [id, amount] of Object.entries(this.mods.startResource)) {
      if (id in state.amounts && amount > 0) state.amounts[id] = amount;
    }
  }

  /* -- gates ------------------------------------------------------------- */

  /** Progress rather than a boolean: the UI reveals content at partial progress. */
  gateProgress(gate) {
    if (!gate || gate.kind === 'none') return 1;
    const amount = Math.max(1e-9, gate.amount);
    switch (gate.kind) {
      case 'resource_total': return Math.min(1, (this.state.earned[gate.target] ?? 0) / amount);
      case 'resource_now': return Math.min(1, (this.state.amounts[gate.target] ?? 0) / amount);
      case 'upgrades_owned': return Math.min(1, this.state.upgrades.length / amount);
      case 'family_owned': {
        const owned = this.state.upgrades.filter(id => this.game.byId.upgrade[id]?.family === gate.target).length;
        return Math.min(1, owned / amount);
      }
      case 'upgrade_owned': return this.state.upgrades.includes(gate.target) ? 1 : 0;
      case 'ascensions': return Math.min(1, this.state.ascensions / amount);
      default: return 1;
    }
  }

  isUnlocked(gate) { return this.gateProgress(gate) >= 1; }

  gateText(gate) {
    if (!gate || gate.kind === 'none') return '';
    const resource = id => this.game.byId.resource[id]?.name ?? id;
    switch (gate.kind) {
      case 'resource_total': return `Earn ${fmt(gate.amount)} ${resource(gate.target)} in total`;
      case 'resource_now': return `Hold ${fmt(gate.amount)} ${resource(gate.target)}`;
      case 'upgrades_owned': return `Own ${gate.amount} upgrades`;
      case 'family_owned': return `Own ${gate.amount} ${gate.target} upgrades`;
      case 'upgrade_owned': return `Research ${this.game.byId.upgrade[gate.target]?.name ?? 'a prerequisite'}`;
      case 'ascensions': return `Reach ascension ${gate.amount}`;
      default: return '';
    }
  }

  upgradeAvailable(upgrade) {
    return upgrade.requires.every(r => this.state.upgrades.includes(r)) && this.isUnlocked(upgrade.unlock);
  }

  /* -- presentation ------------------------------------------------------ */

  effectText(effect) {
    const everything = (effect.target || '*') === '*';
    const named = kind => {
      if (everything) return { resource: 'all resources', action: 'all actions', generator: 'all generators' }[kind];
      return this.game.byId[kind][effect.target]?.name ?? effect.target;
    };
    const v = effect.value;
    switch (effect.kind) {
      case 'global_mult': return `×${+v.toFixed(3)} to all production`;
      case 'resource_rate': return `×${+v.toFixed(3)} ${named('resource')} production`;
      case 'resource_cap': return `×${+v.toFixed(3)} ${named('resource')} storage`;
      case 'action_yield': return `×${+v.toFixed(3)} output from ${named('action')}`;
      case 'generator_rate': return `×${+v.toFixed(3)} output from ${named('generator')}`;
      case 'generator_cost': return `−${((1 - v) * 100).toFixed(0)}% cost for ${named('generator')}`;
      case 'cooldown': return `−${((1 - v) * 100).toFixed(0)}% cooldown on ${named('action')}`;
      case 'decay': return `−${((1 - v) * 100).toFixed(0)}% ${named('resource')} decay`;
      case 'crit_chance': return `+${(v * 100).toFixed(1)}% chance of ×${effect.mult} from ${named('action')}`;
      case 'start_resource': return `Start each run with ${fmt(v)} ${named('resource')}`;
      default: return effect.kind;
    }
  }

  effectsText(effects) { return effects.map(e => this.effectText(e)).join(' · '); }
}

/* -- rendering ------------------------------------------------------------ */

const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};

/**
 * Reconcile a list by id, updating nodes in place.
 *
 * Rebuilding with innerHTML at the tick rate cancels in-progress taps, drops
 * :active feedback, and resets the upgrade list's scroll position several times a
 * second. Node identity is load-bearing.
 */
function keyedList(container, items, create, update) {
  const existing = (container._byId ??= new Map());
  const seen = new Set();
  items.forEach((item, index) => {
    seen.add(item.id);
    let node = existing.get(item.id);
    if (!node) { node = create(item); node.dataset.id = item.id; existing.set(item.id, node); }
    update(node, item);
    if (container.children[index] !== node) container.insertBefore(node, container.children[index] || null);
  });
  for (const [id, node] of existing) if (!seen.has(id)) { node.remove(); existing.delete(id); }
}

function chip(entry, short) {
  const node = el('span', 'chip' + (short ? ' is-short' : ''));
  if (entry.color) node.style.setProperty('--res', entry.color);
  node.appendChild(el('i', 'dot'));
  node.appendChild(el('span', null, entry.label));
  return node;
}

/* -- app ------------------------------------------------------------------ */

const SAVE_KEY = 'incgame.standalone.save';
let engine = null;
let tab = 'do';

function bundle(cost) {
  return Object.entries(cost).map(([id, amount]) => {
    const resource = engine.game.byId.resource[id];
    return { id, color: resource.color, label: `${fmt(amount)} ${resource.name}`, have: (engine.state.amounts[id] ?? 0) >= amount };
  });
}

function applyTheme(theme) {
  const root = document.documentElement;
  root.style.setProperty('--accent', theme.accent);
  root.style.setProperty('--secondary', theme.secondary);
  root.style.setProperty('--hue', theme.hue);
}

function renderResources() {
  const net = engine.netRates();
  const visible = engine.game.resources.filter(r =>
    r.tier === 0 || (engine.state.earned[r.id] ?? 0) > 0 || (engine.state.amounts[r.id] ?? 0) > 0);

  keyedList(document.getElementById('resources'), visible,
    resource => {
      const node = el('div', 'res');
      node.style.setProperty('--res', resource.color);
      node.title = resource.description;
      node.appendChild(el('div', 'res-name', resource.name));
      node.appendChild(el('div', 'res-amount'));
      node.appendChild(el('div', 'res-rate'));
      const bar = el('div', 'res-bar'); bar.appendChild(el('i')); node.appendChild(bar);
      return node;
    },
    (node, resource) => {
      const amount = engine.state.amounts[resource.id] ?? 0;
      const cap = engine.capOf(resource.id);
      node.querySelector('.res-amount').textContent = fmt(amount);
      const rate = node.querySelector('.res-rate');
      rate.textContent = Number.isFinite(cap) ? `${fmtRate(net[resource.id])} · max ${fmt(cap)}` : fmtRate(net[resource.id]);
      rate.classList.toggle('is-negative', net[resource.id] < -1e-9);
      const bar = node.querySelector('.res-bar');
      bar.hidden = !Number.isFinite(cap);
      if (Number.isFinite(cap)) {
        const fill = Math.min(1, amount / cap);
        bar.firstElementChild.style.width = `${(fill * 100).toFixed(1)}%`;
        node.classList.toggle('is-full', fill >= 0.999);
      }
    });
}

function renderActions() {
  const now = Date.now() / 1000;
  const visible = engine.game.actions.filter(a => engine.gateProgress(a.unlock) >= TEASE_THRESHOLD);

  keyedList(document.getElementById('actions'), visible,
    action => {
      const node = el('button', 'action');
      node.type = 'button';
      node.appendChild(el('div', 'action-name'));
      node.appendChild(el('div', 'action-desc'));
      node.appendChild(el('div', 'action-flow'));
      node.appendChild(el('div', 'lock-gate'));
      const bar = el('div', 'lock-bar'); bar.appendChild(el('i')); node.appendChild(bar);
      node.appendChild(el('div', 'action-cool'));
      node.addEventListener('click', () => { if (!node.disabled) act(node.dataset.id); });
      return node;
    },
    (node, action) => {
      const unlocked = engine.isUnlocked(action.unlock);
      const progress = engine.gateProgress(action.unlock);
      node.querySelector('.action-name').textContent = action.name;
      node.querySelector('.action-desc').textContent = action.description;

      const flow = node.querySelector('.action-flow');
      flow.textContent = '';
      if (unlocked) {
        const costs = bundle(action.cost);
        if (costs.length) {
          costs.forEach(c => flow.appendChild(chip(c, !c.have)));
          flow.appendChild(el('span', 'action-arrow', '→'));
        }
        bundle(engine.actionYield(action)).forEach(o => flow.appendChild(chip(o)));
      }

      const gate = node.querySelector('.lock-gate'), bar = node.querySelector('.lock-bar');
      gate.hidden = unlocked; bar.hidden = unlocked;
      if (!unlocked) {
        gate.textContent = engine.gateText(action.unlock);
        bar.firstElementChild.style.width = `${(progress * 100).toFixed(0)}%`;
      }

      node.classList.toggle('locked', !unlocked);
      node.classList.toggle('is-primary', unlocked && action.kind === 'click');

      const ready = engine.state.actionReady[action.id] ?? 0;
      const cooldown = engine.actionCooldown(action);
      const sweep = node.querySelector('.action-cool');
      if (cooldown > 0 && ready > now) {
        sweep.style.width = `${Math.min(100, ((ready - now) / cooldown) * 100).toFixed(1)}%`;
        node.disabled = true;
      } else {
        sweep.style.width = '0%';
        node.disabled = !unlocked || !engine.canAfford(action.cost);
      }
    });
}

function renderMechanics() {
  keyedList(document.getElementById('mechanics'), engine.game.mechanics,
    () => {
      const node = el('div', 'mech');
      node.appendChild(el('div', 'mech-kind'));
      node.appendChild(el('div', 'mech-name'));
      node.appendChild(el('div', 'mech-desc'));
      node.appendChild(el('div', 'mech-live'));
      return node;
    },
    (node, mechanic) => {
      node.querySelector('.mech-kind').textContent = mechanic.kind;
      node.querySelector('.mech-name').textContent = mechanic.name;
      node.querySelector('.mech-desc').textContent = mechanic.description;
      const live = node.querySelector('.mech-live');
      let text = '';
      if (mechanic.kind === 'momentum') {
        const stacks = Math.min(Math.max(0, engine.state.streak - 1), mechanic.params.maxStacks);
        text = `${stacks} stacks · ×${(1 + mechanic.params.perClick * stacks).toFixed(2)}`;
      } else if (mechanic.kind === 'resonance') {
        const until = mechanic.params.everyN - (engine.state.actionCount % mechanic.params.everyN);
        text = `${until} action${until === 1 ? '' : 's'} to payout`;
      } else if (mechanic.kind === 'synergy') {
        const count = engine.state.upgrades.filter(id => engine.game.byId.upgrade[id]?.family === mechanic.params.family).length;
        text = `${count} ${mechanic.params.family} owned · ×${(1 + mechanic.params.per * count).toFixed(2)}`;
      } else if (mechanic.kind === 'symbiosis') {
        text = `×${engine.symbiosisFactor(mechanic.params.resource).toFixed(2)} currently`;
      }
      live.hidden = !text;
      live.textContent = text;
    });
}

function renderGenerators() {
  const { efficiency } = engine.rates();
  const container = document.getElementById('generators');
  const visible = engine.game.generators.filter(g =>
    engine.gateProgress(g.unlock) >= TEASE_THRESHOLD || (engine.state.generators[g.id] ?? 0) > 0);

  if (!visible.length) {
    container.textContent = '';
    container._byId = new Map();
    container.appendChild(el('div', 'empty', 'Nothing to build yet. Keep working — the first one shows up here.'));
    return;
  }

  keyedList(container, visible,
    () => {
      const node = el('div', 'card');
      const top = el('div', 'card-top');
      const left = el('div');
      left.appendChild(el('div', 'card-name'));
      left.appendChild(el('div', 'card-sub'));
      top.appendChild(left);
      top.appendChild(el('div', 'card-owned'));
      node.appendChild(top);
      node.appendChild(el('div', 'card-meta'));
      node.appendChild(el('div', 'throttle'));
      node.appendChild(el('div', 'lock-gate'));
      const bar = el('div', 'lock-bar'); bar.appendChild(el('i')); node.appendChild(bar);
      const buy = el('div', 'card-buy');
      const one = el('button', 'btn btn-primary'); one.type = 'button';
      const max = el('button', 'btn btn-max', 'Max'); max.type = 'button';
      one.addEventListener('click', () => build(node.dataset.id, 1));
      max.addEventListener('click', () => build(node.dataset.id, 'max'));
      buy.append(one, max);
      node.appendChild(buy);
      return node;
    },
    (node, generator) => {
      const unlocked = engine.isUnlocked(generator.unlock);
      const owned = engine.state.generators[generator.id] ?? 0;
      const each = generator.rate * engine.mult(engine.mods.generatorRate, generator.id);
      const eff = efficiency[generator.id] ?? 1;

      node.querySelector('.card-name').textContent = generator.name;
      node.querySelector('.card-sub').textContent = generator.description;
      const ownedTag = node.querySelector('.card-owned');
      ownedTag.textContent = `×${owned}`;
      ownedTag.hidden = owned === 0;

      const meta = node.querySelector('.card-meta');
      meta.textContent = '';
      meta.appendChild(el('span', 'chip', `${fmt(each)}/s ${engine.game.byId.resource[generator.resource].name} each`));
      if (owned > 0) meta.appendChild(el('span', 'chip', `${fmtRate(each * owned * eff)} total`));
      for (const [id, per] of Object.entries(generator.upkeep)) {
        meta.appendChild(el('span', 'chip', `eats ${fmt(per)}/s ${engine.game.byId.resource[id].name}`));
      }

      const throttled = owned > 0 && eff < 0.999;
      const throttle = node.querySelector('.throttle');
      throttle.hidden = !throttled;
      if (throttled) {
        const feeds = Object.keys(generator.upkeep).map(id => engine.game.byId.resource[id].name).join(', ');
        throttle.textContent = `Starved — running at ${(eff * 100).toFixed(0)}%. Feed it more ${feeds}.`;
      }
      node.classList.toggle('is-throttled', throttled);

      const gate = node.querySelector('.lock-gate'), bar = node.querySelector('.lock-bar'), buy = node.querySelector('.card-buy');
      gate.hidden = unlocked; bar.hidden = unlocked; buy.hidden = !unlocked;
      node.classList.toggle('locked', !unlocked);
      if (!unlocked) {
        gate.textContent = engine.gateText(generator.unlock);
        bar.firstElementChild.style.width = `${(engine.gateProgress(generator.unlock) * 100).toFixed(0)}%`;
        return;
      }

      const cost = engine.generatorCost(generator.id, 1);
      const [one, max] = buy.children;
      one.textContent = `Build · ${fmt(cost)} ${engine.game.byId.resource[generator.costResource].name}`;
      one.disabled = (engine.state.amounts[generator.costResource] ?? 0) < cost;
      const affordable = engine.maxAffordable(generator.id);
      max.textContent = affordable > 1 ? `Max ×${affordable}` : 'Max';
      max.disabled = affordable < 1;
    });
}

function renderUpgrades() {
  const container = document.getElementById('upgrades');
  const owned = new Set(engine.state.upgrades);
  const shown = [], hidden = [];

  for (const upgrade of engine.game.upgrades) {
    const requirementsMet = upgrade.requires.every(r => owned.has(r));
    const progress = engine.gateProgress(upgrade.unlock);
    const entry = { upgrade, owned: owned.has(upgrade.id), requirementsMet, progress,
      sort: Object.values(upgrade.cost).reduce((a, b) => a + b, 0), id: upgrade.id };
    if (entry.owned || (requirementsMet && progress >= TEASE_THRESHOLD)) shown.push(entry);
    else if (!entry.owned) hidden.push(entry);
  }

  // Never leave the panel empty: surface the nearest few locked upgrades so there
  // is always a visible next objective.
  if (!shown.some(e => !e.owned) && hidden.length) {
    hidden.sort((a, b) => b.progress - a.progress || a.sort - b.sort);
    shown.push(...hidden.slice(0, 3));
  }
  shown.sort((a, b) => Number(a.owned) - Number(b.owned) || a.upgrade.tier - b.upgrade.tier || a.sort - b.sort);

  if (!shown.length) {
    container.textContent = '';
    container._byId = new Map();
    container.appendChild(el('div', 'empty', 'No research available yet.'));
    return;
  }

  keyedList(container, shown,
    () => {
      const node = el('div', 'card');
      const top = el('div', 'card-top'), left = el('div');
      left.appendChild(el('div', 'family'));
      left.appendChild(el('div', 'card-name'));
      left.appendChild(el('div', 'card-sub'));
      top.appendChild(left);
      node.appendChild(top);
      node.appendChild(el('div', 'effect'));
      node.appendChild(el('div', 'card-meta'));
      node.appendChild(el('div', 'lock-gate'));
      const bar = el('div', 'lock-bar'); bar.appendChild(el('i')); node.appendChild(bar);
      const buy = el('div', 'card-buy');
      const button = el('button', 'btn btn-primary', 'Research'); button.type = 'button';
      button.addEventListener('click', () => research(node.dataset.id));
      buy.appendChild(button);
      node.appendChild(buy);
      return node;
    },
    (node, entry) => {
      const { upgrade } = entry;
      node.querySelector('.family').textContent = `${upgrade.family} · tier ${upgrade.tier + 1}`;
      node.querySelector('.card-name').textContent = upgrade.name;
      node.querySelector('.card-sub').textContent = upgrade.description;
      node.querySelector('.effect').textContent = engine.effectsText(upgrade.effects);

      const meta = node.querySelector('.card-meta');
      meta.textContent = '';
      bundle(upgrade.cost).forEach(c => meta.appendChild(chip(c, !c.have)));

      const gate = node.querySelector('.lock-gate'), bar = node.querySelector('.lock-bar'), buy = node.querySelector('.card-buy');
      node.classList.toggle('is-owned', entry.owned);

      if (entry.owned) {
        gate.hidden = false; gate.textContent = 'Researched';
        bar.hidden = true; buy.hidden = true;
        node.classList.remove('locked');
        return;
      }

      const missing = upgrade.requires.filter(r => !engine.state.upgrades.includes(r));
      const unlocked = entry.requirementsMet && entry.progress >= 1;
      if (!unlocked) {
        gate.hidden = false;
        gate.textContent = missing.length
          ? `Requires ${missing.map(r => engine.game.byId.upgrade[r].name).join(', ')}`
          : engine.gateText(upgrade.unlock);
        bar.hidden = false;
        bar.firstElementChild.style.width = `${(entry.progress * 100).toFixed(0)}%`;
        buy.hidden = true;
        node.classList.add('locked');
        return;
      }

      gate.hidden = true; bar.hidden = true; buy.hidden = false;
      node.classList.remove('locked');
      buy.firstElementChild.disabled = !engine.canAfford(upgrade.cost);
    });
}

function renderPrestige() {
  const head = document.getElementById('prestige-head');
  const points = engine.prestigePoints();

  if (!head._built) {
    head._built = true;
    head.appendChild(el('h2'));
    head.appendChild(el('p', 'hint'));
    const nums = el('div', 'prestige-nums');
    for (const key of ['held', 'points', 'ascensions']) {
      const box = el('div', 'prestige-num');
      box.dataset.key = key;
      box.appendChild(el('div', 'k'));
      box.appendChild(el('div', 'v'));
      nums.appendChild(box);
    }
    head.appendChild(nums);
    const button = el('button', 'btn btn-danger btn-wide');
    button.type = 'button';
    button.addEventListener('click', ascend);
    head.appendChild(button);
  }

  const name = engine.game.prestigeName;
  head.querySelector('h2').textContent = `Ascend for ${name}`;
  head.querySelector('.hint').textContent =
    `Resetting clears this run — resources, buildings, research. You keep ${name} and everything bought with it.`;

  const values = { held: fmt(engine.state.prestigeCurrency), points: fmt(points), ascensions: String(engine.state.ascensions) };
  const labels = { held: `${name} held`, points: 'Ascend for', ascensions: 'Ascensions' };
  head.querySelectorAll('.prestige-num').forEach(box => {
    box.querySelector('.k').textContent = labels[box.dataset.key];
    box.querySelector('.v').textContent = values[box.dataset.key];
  });

  const button = head.querySelector('button');
  button.textContent = points >= 1 ? `Ascend — gain ${fmt(points)} ${name}` : 'Not enough progress yet';
  button.disabled = points < 1;

  keyedList(document.getElementById('prestige-upgrades'), engine.game.prestigeUpgrades,
    () => {
      const node = el('div', 'card');
      const top = el('div', 'card-top'), left = el('div');
      left.appendChild(el('div', 'card-name'));
      left.appendChild(el('div', 'card-sub'));
      top.appendChild(left);
      top.appendChild(el('div', 'card-owned'));
      node.appendChild(top);
      node.appendChild(el('div', 'effect'));
      const buy = el('div', 'card-buy');
      const button = el('button', 'btn btn-primary'); button.type = 'button';
      button.addEventListener('click', () => buyPermanent(node.dataset.id));
      buy.appendChild(button);
      node.appendChild(buy);
      return node;
    },
    (node, upgrade) => {
      const level = engine.state.prestigeLevels[upgrade.id] ?? 0;
      const maxed = level >= upgrade.maxLevel;
      const cost = upgrade.baseCost * Math.pow(upgrade.costGrowth, level);
      node.querySelector('.card-name').textContent = upgrade.name;
      node.querySelector('.card-sub').textContent = upgrade.description;
      node.querySelector('.effect').textContent = engine.effectsText(upgrade.effects);
      node.querySelector('.card-owned').textContent =
        upgrade.maxLevel > 1 ? `${level}/${upgrade.maxLevel}` : (level ? '✓' : '—');
      const button = node.querySelector('button');
      button.textContent = maxed ? 'Maxed' : `Buy · ${fmt(cost)}`;
      button.disabled = maxed || engine.state.prestigeCurrency < cost;
      node.classList.toggle('is-owned', maxed);
    });
}

function renderBadges() {
  const badges = {
    build: engine.game.generators.some(g => engine.isUnlocked(g.unlock)
      && (engine.state.amounts[g.costResource] ?? 0) >= engine.generatorCost(g.id, 1)),
    research: engine.game.upgrades.some(u => !engine.state.upgrades.includes(u.id)
      && engine.upgradeAvailable(u) && engine.canAfford(u.cost)),
    ascend: engine.prestigePoints() >= 1 || engine.game.prestigeUpgrades.some(p => {
      const level = engine.state.prestigeLevels[p.id] ?? 0;
      return level < p.maxLevel && engine.state.prestigeCurrency >= p.baseCost * Math.pow(p.costGrowth, level);
    }),
  };
  document.querySelectorAll('.tab').forEach(t => {
    const badge = t.querySelector('.badge');
    if (badge) badge.hidden = !badges[t.dataset.tab];
  });
}

function renderStats() {
  const rows = [
    ['Playtime', fmtDuration(engine.state.playtime)],
    ['Actions', engine.state.actionCount],
    ['Research', engine.state.upgrades.length],
    ['Buildings', Object.values(engine.state.generators).reduce((a, b) => a + b, 0)],
    ['Ascensions', engine.state.ascensions],
    ['Best ascend', fmt(engine.state.bestPoints)],
  ];
  const container = document.getElementById('menu-stats');
  container.textContent = '';
  for (const [key, value] of rows) {
    const row = el('div');
    row.appendChild(el('span', null, key));
    row.appendChild(el('b', null, String(value)));
    container.appendChild(row);
  }
}

function render() {
  renderResources();
  if (tab === 'do') { renderActions(); renderMechanics(); }
  else if (tab === 'build') renderGenerators();
  else if (tab === 'research') renderUpgrades();
  else if (tab === 'ascend') renderPrestige();
  renderBadges();
}

/* -- interaction ---------------------------------------------------------- */

function toast(text, kind) {
  const container = document.getElementById('toasts');
  // A fast clicker outruns the removal timer; an unbounded column would cover the
  // buttons being clicked.
  while (container.children.length >= 4) container.firstElementChild.remove();
  const node = el('div', 'toast' + (kind ? ` is-${kind}` : ''), text);
  container.appendChild(node);
  setTimeout(() => node.remove(), 1450);
}

function act(id) {
  const result = engine.doAction(id);
  if (result.ok) {
    const gained = Object.entries(result.gained)
      .map(([rid, amount]) => `+${fmt(amount)} ${engine.game.byId.resource[rid].name}`).join('  ');
    if (result.crit) toast(`×${result.multiplier.toFixed(1)}!  ${gained}`, 'crit');
    else if (result.multiplier > 1.15) toast(`×${result.multiplier.toFixed(2)}  ${gained}`, 'good');
    else if (gained) toast(gained);
    if (result.cascade) toast(`${result.cascade.name} fired free`, 'crit');
  } else if (result.reason !== 'cooling down') {
    toast(result.reason, 'bad');
  }
  render();
}

function build(id, count) {
  const result = engine.buyGenerator(id, count);
  toast(result.ok ? `Built ×${result.bought}` : result.reason, result.ok ? 'good' : 'bad');
  render();
}

function research(id) {
  const result = engine.buyUpgrade(id);
  toast(result.ok ? `Researched ${result.name}` : result.reason, result.ok ? 'good' : 'bad');
  render();
}

function buyPermanent(id) {
  const result = engine.buyPrestigeUpgrade(id);
  toast(result.ok ? 'Permanent upgrade bought' : result.reason, result.ok ? 'good' : 'bad');
  render();
}

function ascend() {
  const points = engine.prestigePoints();
  if (points < 1) return;
  const name = engine.game.prestigeName;
  if (!confirm(`Ascend now?\n\nThis clears the run and grants ${fmt(points)} ${name}.`)) return;
  const result = engine.prestige();
  if (result.ok) { toast(`Ascended — +${fmt(result.points)} ${name}`, 'crit'); showTab('do'); }
  save();
  render();
}

function showTab(name) {
  tab = name;
  document.querySelectorAll('.panel').forEach(p => (p.hidden = p.dataset.tab !== name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('is-active', t.dataset.tab === name));
  render();
}

/* -- persistence ---------------------------------------------------------- */

/** A save is a seed plus progress; the content is regenerated on load. */
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, seed: engine.game.seed, savedAt: Date.now() / 1000, progress: engine.state,
    }));
  } catch (err) {
    // A full quota is not something the player can act on mid-run; the next
    // autosave retries.
  }
}

function load() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return null;
  try {
    const data = JSON.parse(raw);
    if (data.v !== 1 || typeof data.seed !== 'number') return null;
    const game = generateGame(data.seed);
    const state = data.progress;
    // Drop ids this build no longer generates rather than crashing on them.
    state.upgrades = (state.upgrades || []).filter(id => game.byId.upgrade[id]);
    for (const id of Object.keys(state.generators || {})) if (!game.byId.generator[id]) delete state.generators[id];
    for (const resource of game.resources) state.amounts[resource.id] ??= 0;
    // Cooldowns are deliberately not restored: returning to find yesterday's
    // buttons still cooling down is annoyance with no design value.
    state.actionReady = {};
    state.updatedAt = data.savedAt || Date.now() / 1000;
    return new Engine(game, state);
  } catch (err) {
    return null;
  }
}

function start(seed) {
  engine = new Engine(generateGame(seed));
  localStorage.removeItem(SAVE_KEY);
  mount();
  save();
}

function mount() {
  applyTheme(engine.game.theme);
  document.getElementById('run-title').textContent = engine.game.title;
  document.getElementById('run-flavor').textContent = engine.game.flavor;
  document.getElementById('menu-seed').textContent = String(engine.game.seed);
  document.title = `${engine.game.title} — incremental`;
  // A new world clears every list so nothing from the previous run survives.
  ['resources', 'actions', 'mechanics', 'generators', 'upgrades', 'prestige-upgrades'].forEach(id => {
    const node = document.getElementById(id);
    node.textContent = '';
    node._byId = new Map();
  });
  render();
}

/* -- boot ----------------------------------------------------------------- */

function randomSeed() { return Math.floor(Math.random() * 2147483646) + 1; }

engine = load() || new Engine(generateGame(randomSeed()));
mount();

// Offline production is credited from the save timestamp on the first advance.
const offline = engine.advance();
if (offline > 60) toast(`Welcome back — ${fmtDuration(offline)} of production collected`, 'good');
render();

setInterval(() => { engine.advance(); render(); }, 250);
setInterval(save, 10000);
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { engine.advance(); render(); } else { save(); }
});

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));

// Keyboard play on desktop: 1-9 fire the unlocked actions in order.
document.addEventListener('keydown', event => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (document.activeElement?.tagName === 'INPUT') return;
  const index = Number(event.key) - 1;
  if (!Number.isInteger(index) || index < 0) return;
  const unlocked = engine.game.actions.filter(a => engine.isUnlocked(a.unlock));
  if (unlocked[index]) { event.preventDefault(); act(unlocked[index].id); }
});

const menu = document.getElementById('menu');
document.getElementById('btn-menu').addEventListener('click', () => { renderStats(); menu.showModal(); });
document.getElementById('btn-close-menu').addEventListener('click', () => menu.close());

document.getElementById('btn-copy-seed').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(String(engine.game.seed)); toast('Seed copied', 'good'); }
  catch (err) { toast(`Seed: ${engine.game.seed}`); }
});

document.getElementById('btn-export').addEventListener('click', async () => {
  const text = localStorage.getItem(SAVE_KEY) || '';
  try { await navigator.clipboard.writeText(text); toast('Save copied to clipboard', 'good'); }
  catch (err) {
    // Clipboard is unavailable in some contexts; a download always works.
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = `incgame-${engine.game.seed}.json`;
    link.click();
    URL.revokeObjectURL(url);
  }
});

document.getElementById('btn-import').addEventListener('click', () => {
  const text = prompt('Paste a save:');
  if (!text) return;
  try {
    JSON.parse(text);
    localStorage.setItem(SAVE_KEY, text);
    const restored = load();
    if (!restored) throw new Error('save did not load');
    engine = restored;
    mount();
    menu.close();
    toast('Save loaded', 'good');
  } catch (err) {
    toast(`Import failed: ${err.message}`, 'bad');
  }
});

document.getElementById('btn-new').addEventListener('click', () => {
  const raw = document.getElementById('menu-new-seed').value.trim();
  const seed = raw === '' ? randomSeed() : Number(raw);
  if (!Number.isFinite(seed)) { toast('Seed must be a number', 'bad'); return; }
  if (!confirm('Generate a new world? The current run is discarded.')) return;
  start(Math.floor(Math.abs(seed)) || randomSeed());
  menu.close();
  showTab('do');
  toast('New world generated', 'good');
});
</script>
