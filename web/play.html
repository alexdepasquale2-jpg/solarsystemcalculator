<title>Incremental — a different game every seed</title>

<!--
  Standalone build.

  The same game as `python -m incgame serve`, with the generator and engine ported
  to run in the browser so it works from a URL with no server. See web/README.md
  for what that duplication costs and why it exists.

  The visual system is the one in frontend/css/style.css: palette derived from the
  seed at runtime, deliberately dark in both colour schemes (the generated palette
  picks lightness in the 58-72% band for contrast against dark, and a light ground
  would need a second palette and a second contrast pass per seed), mobile-first,
  tabular numerals everywhere digits line up.
-->

<style>
:root {
  /* Set per run by applyTheme() from the generated palette. */
  --accent: #7cc4ff;
  --secondary: #ffb27c;
  --hue: 210;

  /* Neutrals are blue-biased rather than pure grey, so the ground sits under the
     generated accents instead of fighting them. */
  --bg: #0b0e14;
  --bg-raised: #141924;
  --bg-card: #171d29;
  --bg-card-hi: #1e2534;
  --line: #263041;
  --text: #e8edf7;
  --text-dim: #8b97ad;
  --text-faint: #5b667a;
  --good: #62d29a;
  --bad: #ff7a7a;

  --radius: 14px;
  --tap: 48px;
  --pad: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  color-scheme: dark;
}

/* The game commits to one visual world. This is a choice, not an omission: the
   per-seed palette is generated for a dark ground. */
@media (prefers-color-scheme: light) { :root { color-scheme: dark; } }

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(120% 60% at 50% 0%, hsl(var(--hue) 45% 14%) 0%, var(--bg) 62%);
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  padding-bottom: calc(var(--tap) + 26px + var(--safe-b));
  min-height: 100vh;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* -- top bar ------------------------------------------------------------- */

.topbar { display: flex; align-items: flex-start; gap: 10px; padding: calc(var(--safe-t) + 12px) var(--pad) 8px; }
.topbar-main { flex: 1; min-width: 0; }
.topbar h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; text-wrap: balance; }
.flavor {
  margin: 3px 0 0; font-size: 12.5px; color: var(--text-faint);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.icon-btn {
  flex: 0 0 auto; width: 40px; height: 40px;
  border: 1px solid var(--line); border-radius: 11px;
  background: var(--bg-raised); color: var(--text-dim);
  font-size: 20px; line-height: 1; cursor: pointer;
}
.icon-btn:active { background: var(--bg-card-hi); }

/* -- resource rail ------------------------------------------------------- */

.resources {
  position: sticky; top: 0; z-index: 20;
  display: flex; gap: 8px; padding: 8px var(--pad) 10px;
  overflow-x: auto; scrollbar-width: none;
  background: linear-gradient(var(--bg) 65%, transparent);
  backdrop-filter: blur(8px);
}
.resources::-webkit-scrollbar { display: none; }
.res {
  flex: 0 0 auto; min-width: 108px; padding: 8px 11px 9px;
  border: 1px solid var(--line); border-left: 3px solid var(--res, var(--accent));
  border-radius: 11px; background: var(--bg-raised);
}
.res-name {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-faint); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 140px;
}
.res-amount { font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 640; color: var(--res, var(--text)); line-height: 1.2; }
.res-rate { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.res-rate.is-negative { color: var(--bad); }
.res-bar { margin-top: 5px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.res-bar > i { display: block; height: 100%; width: 0; background: var(--res, var(--accent)); transition: width .25s linear; }
.res.is-full .res-bar > i { background: var(--bad); }

/* -- panels -------------------------------------------------------------- */

main { padding: 4px var(--pad) 0; }
.panel[hidden] { display: none; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 2px 8px; }
.section-head h2 {
  margin: 0; font-size: 11px; font-weight: 650; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-faint);
}
.empty {
  padding: 22px 14px; border: 1px dashed var(--line); border-radius: var(--radius);
  color: var(--text-faint); font-size: 13px; text-align: center;
}

/* -- actions ------------------------------------------------------------- */

.actions { display: grid; gap: 10px; }
@media (min-width: 520px) { .actions { grid-template-columns: 1fr 1fr; } }

.action {
  position: relative; display: block; width: 100%; min-height: 68px;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg-card); color: var(--text); text-align: left;
  cursor: pointer; overflow: hidden; font: inherit;
}
.action:active:not(:disabled) { transform: scale(.985); background: var(--bg-card-hi); }
.action:disabled { opacity: .5; cursor: default; }
.action.is-primary {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 12%, var(--bg-card)), var(--bg-card));
}
.action-name { font-weight: 620; font-size: 15px; }
.action-desc { margin-top: 1px; font-size: 12px; color: var(--text-faint); }
.action-flow { margin-top: 7px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; }
.action-arrow { color: var(--text-faint); }
.action-cool { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--accent); }

.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;
  border-radius: 999px; background: var(--bg-raised); border: 1px solid var(--line);
  font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip.is-short { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); color: var(--bad); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--res, var(--accent)); flex: 0 0 auto; }

/* -- locked -------------------------------------------------------------- */

.locked { border-style: dashed; background: transparent; }
.locked .action-name, .locked .card-name { color: var(--text-faint); }
.lock-gate { margin-top: 6px; font-size: 12px; color: var(--text-faint); }
.lock-bar { margin-top: 6px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.lock-bar > i { display: block; height: 100%; background: var(--text-faint); transition: width .3s ease; }

/* -- cards --------------------------------------------------------------- */

.cards { display: grid; gap: 10px; }
@media (min-width: 620px) { .cards { grid-template-columns: 1fr 1fr; } }

.card { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-card); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-name { font-weight: 620; font-size: 14.5px; }
.card-sub { margin-top: 1px; font-size: 12px; color: var(--text-faint); }
.card-owned {
  flex: 0 0 auto; font-variant-numeric: tabular-nums; font-size: 13px;
  color: var(--text-dim); padding: 2px 8px; border-radius: 999px; background: var(--bg-raised);
}
.card-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card-buy { display: flex; gap: 8px; margin-top: 10px; }
.card.is-owned { opacity: .55; }
.card.is-throttled { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.throttle { margin-top: 7px; font-size: 12px; color: var(--bad); }
.effect { margin-top: 7px; font-size: 12.5px; color: var(--accent); }
.family { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); }

.btn {
  min-height: var(--tap); padding: 0 16px; border: 1px solid var(--line);
  border-radius: 11px; background: var(--bg-raised); color: var(--text);
  font: inherit; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer;
}
.btn:active:not(:disabled) { background: var(--bg-card-hi); transform: scale(.985); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary {
  flex: 1;
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
  background: color-mix(in srgb, var(--accent) 16%, var(--bg-raised));
}
.btn-max { flex: 0 0 auto; min-width: 74px; }
.btn-wide { width: 100%; margin-top: 14px; }
.btn-danger {
  border-color: color-mix(in srgb, var(--secondary) 55%, var(--line));
  background: color-mix(in srgb, var(--secondary) 16%, var(--bg-raised));
}

/* -- mechanics ----------------------------------------------------------- */

.mechanics { display: grid; gap: 8px; }
.mech {
  padding: 10px 13px; border: 1px solid var(--line);
  border-left: 3px solid var(--secondary); border-radius: 11px; background: var(--bg-raised);
}
.mech-kind { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }
.mech-name { font-size: 13px; font-weight: 620; }
.mech-desc { margin-top: 3px; font-size: 12.5px; color: var(--text-dim); }
.mech-live { margin-top: 5px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--secondary); }

/* -- prestige ------------------------------------------------------------ */

.prestige-head {
  padding: 16px; border: 1px solid var(--line); border-radius: var(--radius);
  background: linear-gradient(180deg, color-mix(in srgb, var(--secondary) 14%, var(--bg-card)), var(--bg-card));
  margin-bottom: 4px;
}
.prestige-head h2 { margin: 0 0 2px; font-size: 17px; }
.prestige-head .hint { color: var(--text-dim); font-size: 13px; margin: 0 0 12px; }
.prestige-nums { display: flex; gap: 18px; margin-bottom: 12px; flex-wrap: wrap; }
.prestige-num .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); }
.prestige-num .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--secondary); }

/* -- tab bar ------------------------------------------------------------- */

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
  padding: 5px 6px calc(5px + var(--safe-b));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-top: 1px solid var(--line); backdrop-filter: blur(12px);
}
.tab {
  position: relative; min-height: var(--tap); border: 0; border-radius: 11px;
  background: transparent; color: var(--text-faint);
  font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.tab.is-active { background: var(--bg-raised); color: var(--accent); }
.tab .badge {
  position: absolute; top: 8px; right: 50%; margin-right: -34px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
}

/* -- toasts -------------------------------------------------------------- */

.toasts {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tap) + 18px + var(--safe-b));
  z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 5px;
  pointer-events: none; padding: 0 var(--pad);
}
.toast {
  max-width: 100%; padding: 7px 13px; border-radius: 999px;
  background: color-mix(in srgb, var(--bg-card-hi) 96%, transparent);
  border: 1px solid var(--line); font-size: 13px; font-variant-numeric: tabular-nums;
  animation: toast-in .18s ease, toast-out .3s ease 1.1s forwards;
}
.toast.is-crit { border-color: var(--secondary); color: var(--secondary); font-weight: 650; }
.toast.is-good { border-color: color-mix(in srgb, var(--good) 60%, var(--line)); }
.toast.is-bad { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); color: var(--bad); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-6px); } }

/* -- menu ---------------------------------------------------------------- */

.menu {
  width: min(440px, calc(100vw - 28px)); padding: 18px;
  border: 1px solid var(--line); border-radius: 18px;
  background: var(--bg-raised); color: var(--text);
}
.menu::backdrop { background: rgb(0 0 0 / .6); }
.menu h2 { margin: 16px 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); }
.menu h2:first-child { margin-top: 0; }
.menu-seed { margin: 0 0 10px; font-size: 13px; color: var(--text-dim); }
.menu-seed code { font-size: 14px; color: var(--accent); background: var(--bg-card); padding: 2px 7px; border-radius: 6px; }
.menu-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 13px; margin-bottom: 4px; }
.menu-stats div { display: flex; justify-content: space-between; gap: 8px; }
.menu-stats span { color: var(--text-faint); }
.menu-stats b { font-weight: 600; font-variant-numeric: tabular-nums; }
.menu-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.menu-actions .btn { flex: 1; min-width: 116px; }
.input {
  flex: 1; min-width: 120px; min-height: var(--tap); padding: 0 13px;
  border: 1px solid var(--line); border-radius: 11px;
  background: var(--bg-card); color: var(--text); font: inherit; font-size: 15px;
}
.hint { font-size: 12.5px; color: var(--text-faint); margin: 0 0 10px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .action:active:not(:disabled), .btn:active:not(:disabled) { transform: none; }
}
</style>

<script>
"use strict";
/* ==========================================================================
   incgame — standalone build

   A port of incgame/{rng,generator,engine,view}.py to the browser. Structure and
   TUNING values follow the Python source; the PRNG differs (mulberry32 vs
   Mersenne Twister), so seed 42 here is not seed 42 there. Within this build a
   seed is fully reproducible, which is the property that matters to a player.
   ========================================================================== */

/* -- number formatting (mirrors model.fmt_number) ------------------------- */

const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];

function fmt(value, places = 2) {
  if (Number.isNaN(value)) return 'NaN';
  if (!Number.isFinite(value)) return value > 0 ? '∞' : '-∞';
  const sign = value < 0 ? '-' : '';
  const abs = Math.abs(value);
  if (abs < 1000) {
    if (abs === Math.trunc(abs)) return sign + Math.trunc(abs);
    return sign + (abs < 10 ? abs.toFixed(places) : abs.toFixed(1));
  }
  const tier = Math.floor(Math.log10(abs) / 3);
  if (tier < SUFFIXES.length) return sign + (abs / Math.pow(1000, tier)).toFixed(places) + SUFFIXES[tier];
  return sign + abs.toExponential(2);
}

function fmtRate(v) {
  if (Math.abs(v) < 1e-9) return '0/s';
  return (v > 0 ? '+' : '−') + fmt(Math.abs(v)) + '/s';
}

function fmtDuration(seconds) {
  const t = Math.max(0, Math.floor(seconds));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${s}s`;
  return `${s}s`;
}

/* -- seeded randomness (mirrors rng.py) ----------------------------------- */

function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Rng {
  constructor(seed) { this.next = mulberry32(seed >>> 0); }
  random() { return this.next(); }
  uniform(a, b) { return a + (b - a) * this.next(); }
  randint(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  choice(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  sample(arr, n) {
    const pool = arr.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, Math.max(0, Math.min(n, pool.length)));
  }
  jitter(value, spread = 0.25) { return value * (1 + this.uniform(-spread, spread)); }
  weighted(pairs) {
    const total = pairs.reduce((s, [, w]) => s + Math.max(0, w), 0);
    let roll = this.next() * total;
    for (const [item, w] of pairs) { roll -= Math.max(0, w); if (roll <= 0) return item; }
    return pairs[pairs.length - 1][0];
  }
}

/** Snap to a number a player reads as deliberate rather than generated. */
function roundNice(value) {
  if (value <= 0) return 0;
  const magnitude = Math.pow(10, Math.floor(Math.log10(value)));
  const scaled = value / magnitude;
  for (const step of [1, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10]) if (scaled <= step) return step * magnitude;
  return 10 * magnitude;
}

function hslHex(h, s, l) {
  const f = n => {
    const k = (n + h * 12) % 12;
    const a = s * Math.min(l, 1 - l);
    const c = l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
    return Math.round(255 * c).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}

/** Evenly spread hues so no two resources in a run are hard to tell apart. */
function palette(rng, count) {
  const offset = rng.random();
  const out = [];
  for (let i = 0; i < count; i++) {
    const hue = (offset + i / Math.max(1, count) + rng.uniform(-0.03, 0.03) + 1) % 1;
    out.push(hslHex(hue, rng.uniform(0.55, 0.85), rng.uniform(0.58, 0.72)));
  }
  return out;
}

function slug(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
}

/** Hands out names without repeating itself; a duplicate name reads as a bug. */
class Namer {
  constructor(rng) { this.rng = rng; this.used = new Set(); }
  unique(...pools) {
    let candidate = '';
    for (let i = 0; i < 24; i++) {
      candidate = pools.map(p => this.rng.choice(p)).join(' ');
      if (!this.used.has(candidate)) { this.used.add(candidate); return candidate; }
    }
    for (const suffix of [' II', ' III', ' IV', ' V', ' VI']) {
      if (!this.used.has(candidate + suffix)) { this.used.add(candidate + suffix); return candidate + suffix; }
    }
    return candidate;
  }
}

/* -- word pools (mirrors names.py) ---------------------------------------- */

const N = {
  ADJ: ['Luminous','Fractal','Hollow','Verdant','Gilded','Umbral','Crystalline','Sundered','Woven','Placid','Feral','Latent','Radiant','Quiet','Molten','Frozen','Drifting','Ancient','Nascent','Eternal','Restless','Silent','Vivid','Pale','Deep','Wild','Tame','Bright','Dim','Vast','Brittle','Supple','Errant','Patient','Sullen','Tidal','Vagrant','Wakeful','Cindered','Glassen','Riven','Sodden','Tempered','Unbound','Waning','Waxing','Hushed','Keen','Numb','Opaline'],
  RES: ['Essence','Ember','Filament','Lumen','Grain','Chime','Cinder','Dust','Echo','Fragment','Glyph','Husk','Ichor','Kernel','Lattice','Mote','Nectar','Ore','Pulse','Quill','Resin','Sap','Shard','Silt','Spark','Tide','Vein','Whisper','Yield','Bloom','Coil','Drift','Flux','Gleam','Haze','Loam','Murmur','Rime','Thread','Brine','Chaff','Ash','Marrow','Vapour','Sediment','Static','Tincture','Verdure','Wick','Zephyr'],
